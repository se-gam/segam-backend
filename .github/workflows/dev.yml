name: Deploy to Amazon Elastic Beanstalk (Prod 2025)

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  CD:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' <<< "$SECRETS_CONTEXT" > .dev.env
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Install dependencies and build
        run: |
          sudo yarn install
          sudo yarn build

      - name: Copy build directory to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_SERVER_ROOT }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          source: './*'
          target: '/home/${{ secrets.DEV_SERVER_USER }}/segam-backend'
          script: dotenv -e .dev.env -- pm2 restart main
